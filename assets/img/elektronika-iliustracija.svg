<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Lustas spausdintinėje plokštėje ir osciloskopo signalas">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d3e"/>
      <stop offset="1" stop-color="#0a2a33"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#7fe3c4" stroke-opacity=".22" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="900" height="900" fill="url(#pcb)"/>

  <!-- Takeliai -->
  <g fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 170V110H130V60"/>
    <path d="M380 170V70H520"/>
    <path d="M520 170V120H700L760 60"/>
    <path d="M600 170V150H820"/>
    <path d="M170 250H90V340"/>
    <path d="M170 330H130L60 400"/>
    <path d="M730 250H845V225"/>
    <path d="M730 330H800L850 380"/>
  </g>
  <g fill="#0a2a33" stroke="#d9a441" stroke-width="7">
    <circle cx="130" cy="60" r="13"/>
    <circle cx="520" cy="70" r="13"/>
    <circle cx="760" cy="60" r="13"/>
    <circle cx="820" cy="150" r="13"/>
    <circle cx="90" cy="340" r="13"/>
    <circle cx="60" cy="400" r="13"/>
    <circle cx="845" cy="225" r="13"/>
    <circle cx="850" cy="380" r="13"/>
  </g>

  <!-- Lusto kojelės -->
  <g fill="#c9ced6">
    <rect x="285" y="170" width="30" height="40" rx="4"/>
    <rect x="365" y="170" width="30" height="40" rx="4"/>
    <rect x="505" y="170" width="30" height="40" rx="4"/>
    <rect x="585" y="170" width="30" height="40" rx="4"/>
    <rect x="170" y="235" width="60" height="30" rx="4"/>
    <rect x="170" y="315" width="60" height="30" rx="4"/>
    <rect x="670" y="235" width="60" height="30" rx="4"/>
    <rect x="670" y="315" width="60" height="30" rx="4"/>
  </g>

  <!-- Lustas -->
  <rect x="220" y="200" width="460" height="230" rx="18" fill="url(#chip)" stroke="#4a505a" stroke-width="4"/>
  <circle cx="256" cy="236" r="11" fill="#4a505a"/>
  <rect x="330" y="255" width="240" height="120" rx="10" fill="none" stroke="#7fe3c4" stroke-width="5"/>
  <path d="M365 315h40l15-30 30 60 30-60 15 30h40" fill="none" stroke="#7fe3c4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Osciloskopo ekranas -->
  <rect x="90" y="500" width="720" height="330" rx="20" fill="#071a20" stroke="#7fe3c4" stroke-opacity=".6" stroke-width="5"/>
  <rect x="100" y="510" width="700" height="310" rx="12" fill="url(#grid)"/>
  <path d="M100 665H800M450 510V820" stroke="#7fe3c4" stroke-opacity=".45" stroke-width="2.5"/>
  <path d="M100 665c35-120 70-120 105 0s70 120 105 0 70-120 105 0 70 120 105 0 70-120 105 0 70 120 105 0 35-60 70-60"
        fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round"/>
  <path d="M100 760h70v-60h88v60h88v-60h88v60h88v-60h88v60h90" fill="none" stroke="#5cc8ff" stroke-width="6" stroke-linejoin="round"/>
</svg>
